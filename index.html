<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0aa579">
<title>FinanceFlow | Gestão Financeira</title>
<style>
:root{--green:#0aa579;--green2:#087e60;--blue:#3569e8;--red:#ed2858;--bg:#f5f7fa;--card:#fff;--text:#10213f;--muted:#728099;--line:#e5e8ee;--soft:#f3f6f8;--input:#eef4ff;--shadow:0 10px 28px rgba(16,33,63,.07)}
[data-theme=dark]{--bg:#0f141b;--card:#171e27;--text:#edf3fb;--muted:#9aa8ba;--line:#2b3542;--soft:#202934;--input:#202a38;--shadow:0 12px 30px rgba(0,0,0,.24)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}.side{width:252px;flex:0 0 252px;background:var(--card);border-right:1px solid var(--line);padding:20px;position:sticky;top:0;height:100vh;z-index:20}.brand{display:flex;gap:12px;align-items:center;padding-bottom:22px;border-bottom:1px solid var(--line)}.logo{width:40px;height:40px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900}.brand b{font-size:18px}.brand small{display:block;color:var(--muted);margin-top:2px}.userbox{padding:18px 0;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.userbox strong{display:block;color:var(--text);font-size:13px;margin-top:4px;overflow:hidden;text-overflow:ellipsis}.nav{display:grid;gap:5px;padding-top:16px}.nav button{border:0;background:transparent;color:var(--muted);padding:12px 10px;border-radius:9px;text-align:left;display:flex;align-items:center;gap:12px}.nav button:hover,.nav button.active{background:rgba(10,165,121,.11);color:var(--green2);font-weight:800}.nav .ico{width:20px;text-align:center}.main{width:min(1500px,100%);margin:auto;padding:28px 4% 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px}.top h1{font-size:36px;line-height:1.1;margin:0 0 5px}.top p{margin:0;color:var(--muted)}.actions{display:flex;gap:9px;align-items:center}.btn,.iconbtn{border:0;border-radius:9px;font-weight:750}.btn{padding:11px 16px;background:var(--green);color:#fff;box-shadow:0 6px 16px rgba(10,165,121,.18)}.btn:hover{filter:brightness(.96)}.btn.secondary{background:var(--soft);color:var(--text);box-shadow:none}.btn.danger{background:rgba(237,40,88,.11);color:var(--red);box-shadow:none}.iconbtn{width:42px;height:42px;border:1px solid var(--line);background:var(--card);color:var(--text)}.month{margin:34px 0 24px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;display:flex;justify-content:center;align-items:center;gap:24px;font-size:20px;font-weight:800}.arrow{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:var(--card);color:var(--text)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.card{padding:22px}.label{font-size:13px;font-weight:750}.value{font-size:28px;font-weight:850;margin-top:9px}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.metricicon{float:right;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:20px}.ig{background:rgba(10,165,121,.12)}.ir{background:rgba(237,40,88,.12)}.ib{background:rgba(53,105,232,.12)}.content{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;margin-top:20px}.panel{padding:22px}.panel h2{font-size:17px;margin:0}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.empty{text-align:center;color:var(--muted);padding:65px 20px}.empty .chart{font-size:48px;color:#aeb9c9}.accounts{display:flex;flex-direction:column;gap:10px}.account{display:flex;justify-content:space-between;gap:10px;padding:14px;border-radius:9px;background:var(--soft)}.account b{display:block}.account span{font-size:12px;color:var(--muted)}.money{font-weight:800;color:var(--text)}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{font-size:12px;color:var(--muted)}.table td{font-size:14px}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.pill.in{background:rgba(10,165,121,.12);color:var(--green)}.pill.out{background:rgba(237,40,88,.12);color:var(--red)}.pagegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.reportgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.bars{display:flex;align-items:end;gap:7px;height:230px;padding-top:15px}.barcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:5px}.bar{width:100%;max-width:30px;border-radius:6px 6px 2px 2px;background:var(--green);min-height:2px}.bar.out{background:var(--red)}.barlabel{font-size:10px;color:var(--muted)}.legend{display:flex;gap:16px;font-size:12px;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:5px}.dot.red{background:var(--red)}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--input);color:var(--text);padding:11px 12px;border-radius:9px;outline:0}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green)}.modal{position:fixed;inset:0;background:rgba(5,12,20,.58);display:none;place-items:center;padding:18px;z-index:100}.modal.show{display:grid}.modalbox{width:min(600px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:24px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h3{margin:0}.toast{position:fixed;right:22px;bottom:22px;z-index:200;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:13px 16px;display:none;max-width:min(420px,calc(100vw - 30px))}.toast.show{display:block}.toast.error{border-color:rgba(237,40,88,.35);color:var(--red)}.mobilebar{display:none}.settingrow{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:16px 0;border-bottom:1px solid var(--line)}.muted{color:var(--muted)}.accountactions{display:flex;gap:7px}.clickable{cursor:pointer}
@media(max-width:1050px){.side{width:220px;flex-basis:220px}.cards{grid-template-columns:repeat(2,1fr)}.content,.pagegrid{grid-template-columns:1fr}.reportgrid{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.app{display:block}.side{display:none}.main{padding:18px 15px 82px}.top h1{font-size:27px}.top{align-items:flex-start}.top .buttontext{display:none}.month{margin:22px 0 18px;font-size:17px}.cards{grid-template-columns:1fr;gap:12px}.content{gap:12px}.panel{padding:17px}.reportgrid{grid-template-columns:1fr}.mobilebar{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);bottom:0;left:0;right:0;height:64px;background:var(--card);border-top:1px solid var(--line);z-index:50}.mobilebar button{border:0;background:transparent;color:var(--muted);font-size:10px}.mobilebar button.active{color:var(--green);font-weight:800}.mobilebar span{display:block;font-size:18px;margin-bottom:2px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.actions .btn{padding:10px 12px}.table{min-width:620px}.top .actions{flex-shrink:0}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand"><div class="logo">▣</div><div><b>FinanceFlow</b><small>Gestão Financeira</small></div></div><div class="userbox">Ambiente autenticado<strong id="userName">FinanceFlow</strong></div><nav class="nav" id="nav"></nav></aside><main class="main"><div id="app"></div></main></div>
<nav class="mobilebar" id="mobilebar"></nav>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div><div class="toast" id="toast"></div>
<script>
const API='https://financeflow-production-edfc.up.railway.app/api';
const state={view:'dashboard',date:new Date(),data:null};
const navItems=[['dashboard','▦','Dashboard'],['transactions','▤','Transações'],['reports','▥','Relatórios'],['categories','◇','Categorias'],['budgets','◎','Orçamentos'],['settings','⚙','Configurações']];
const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0));
const dateBR=v=>new Intl.DateTimeFormat('pt-BR').format(new Date(v));
const token=()=>localStorage.getItem('financeflow.accessToken')||'';
function decodeJwt(t){try{const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(atob(p.padEnd(p.length+(4-p.length%4)%4,'=')))}catch{return{}}}
const claims=decodeJwt(token());
function applyTheme(){const p=localStorage.getItem('financeflow.theme')||'system';const dark=p==='dark'||(p==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';document.querySelector('meta[name="theme-color"]').content=dark?'#0f141b':'#0aa579'}
function setTheme(p){localStorage.setItem('financeflow.theme',p);applyTheme();if(state.view==='settings')render()}
function cycleTheme(){const p=localStorage.getItem('financeflow.theme')||'system';setTheme(p==='system'?'dark':p==='dark'?'light':'system')}
async function api(path,opt={}){let r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{}),Authorization:'Bearer '+token()}});if(r.status===401){const rt=localStorage.getItem('financeflow.refreshToken');if(rt){const rr=await fetch(API+'/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refreshToken:rt})});if(rr.ok){const d=await rr.json();localStorage.setItem('financeflow.accessToken',d.accessToken);localStorage.setItem('financeflow.refreshToken',d.refreshToken);r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{}),Authorization:'Bearer '+d.accessToken}})}}}const text=await r.text();let d={};try{d=text?JSON.parse(text):{}}catch{}if(!r.ok)throw new Error(d.message||'Não foi possível concluir a operação.');return d}
async function load(){const y=state.date.getFullYear(),m=state.date.getMonth()+1;state.data=await api(`/finance/summary?year=${y}&month=${m}`);render()}
function go(v){state.view=v;render();if(v!=='settings')load().catch(e=>toast(e.message,true))}
function navRender(){const html=navItems.map(([id,ico,label])=>`<button data-nav="${id}" class="${state.view===id?'active':''}"><span class="ico">${ico}</span>${label}</button>`).join('');document.getElementById('nav').innerHTML=html;document.getElementById('mobilebar').innerHTML=navItems.slice(0,5).map(([id,ico,label])=>`<button data-nav="${id}" class="${state.view===id?'active':''}"><span>${ico}</span>${label}</button>`).join('')}
function render(){navRender();const el=document.getElementById('app');if(!state.data&&state.view!=='settings'){el.innerHTML='<div class="panel"><b>Carregando seus dados...</b></div>';return}({dashboard,transactions,reports,categories,budgets,settings}[state.view]||dashboard)(el)}
function head(title,sub,actions=''){return `<div class="top"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`}
function monthBox(){return `<div class="month"><button class="arrow" data-month="-1">‹</button>${new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(state.date).replace(/^./,c=>c.toUpperCase())}<button class="arrow" data-month="1">›</button></div>`}
function dashboard(el){const d=state.data;el.innerHTML=head('Dashboard Financeiro','Visão geral das suas finanças',`<button class="iconbtn" data-action="theme" title="Alternar tema">◐</button><button class="btn" data-action="transaction">＋ <span class="buttontext">Nova Transação</span></button>`)+monthBox()+`<section class="cards"><div class="card"><span class="metricicon ig">↗</span><div class="label">Entradas do Mês</div><div class="value green">${money(d.income)}</div></div><div class="card"><span class="metricicon ir">↘</span><div class="label">Saídas do Mês</div><div class="value red">${money(d.expense)}</div></div><div class="card"><span class="metricicon ib">▣</span><div class="label">Patrimônio</div><div class="value blue">${money(d.patrimonio)}</div></div><div class="card"><span class="metricicon ib">⌂</span><div class="label">Investimentos</div><div class="value blue">${money(d.investment)}</div></div></section><section class="content"><div class="panel"><div class="panelhead"><h2>Fluxo de Caixa</h2><div class="legend"><span><i class="dot"></i>Entradas</span><span><i class="dot red"></i>Saídas</span></div></div>${chart(d.byDay||[])}</div><div class="panel"><div class="panelhead"><h2>Contas e Saldos</h2><button class="iconbtn" data-action="account">＋</button></div><div class="accounts">${(d.accounts||[]).map(a=>`<div class="account"><div><b>${esc(a.name)}</b><span>${esc(a.institution||a.type)}</span></div><span class="money">${money(a.balance)}</span></div>`).join('')}</div></div></section>`}
function chart(rows){if(!rows.length)return '<div class="empty"><div class="chart">⌁↗</div><b>Nenhuma transação neste mês</b><br><span>Adicione uma entrada ou saída para visualizar o fluxo.</span></div>';const max=Math.max(1,...rows.flatMap(x=>[Number(x.income),Number(x.expense)]));return `<div class="bars">${rows.map(x=>`<div class="barcol" title="Dia ${x.day}: ${money(x.income)} / ${money(x.expense)}"><div class="bar" style="height:${Math.max(2,Number(x.income)/max*82)}%"></div><div class="bar out" style="height:${Math.max(2,Number(x.expense)/max*82)}%"></div><span class="barlabel">${x.day}</span></div>`).join('')}</div>`}
function transactions(el){const d=state.data;el.innerHTML=head('Transações','Registre e acompanhe todas as movimentações',`<button class="btn" data-action="transaction">＋ Nova Transação</button>`)+`<div class="panel" style="margin-top:24px"><div class="panelhead"><h2>${d.transactions.length} movimentação(ões)</h2><span class="muted">${new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(state.date)}</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Conta</th><th>Tipo</th><th>Valor</th><th></th></tr></thead><tbody>${d.transactions.length?d.transactions.map(t=>{const c=d.categories.find(x=>x.id===t.categoryId),a=d.accounts.find(x=>x.id===t.accountId);return `<tr><td>${dateBR(t.date)}</td><td><b>${esc(t.description)}</b></td><td>${c?esc(c.name):'Sem categoria'}</td><td>${a?esc(a.name):'-'}</td><td><span class="pill ${t.type==='Income'?'in':'out'}">${t.type==='Income'?'Entrada':'Saída'}</span></td><td class="${t.type==='Income'?'green':'red'}"><b>${money(t.amount)}</b></td><td><button class="iconbtn" data-delete-tx="${t.id}">🗑</button></td></tr>`}).join(''):`<tr><td colspan="7" class="muted">Nenhuma transação neste mês.</td></tr>`}</tbody></table></div></div>`}
function reports(el){const d=state.data,byCat={};d.transactions.filter(t=>t.type==='Expense').forEach(t=>{const c=d.categories.find(x=>x.id===t.categoryId)?.name||'Outros';byCat[c]=(byCat[c]||0)+Number(t.amount)});const top=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,8);el.innerHTML=head('Relatórios','Entenda para onde seu dinheiro está indo')+`<div class="reportgrid" style="margin-top:24px"><div class="card"><div class="label">Entradas</div><div class="value green">${money(d.income)}</div></div><div class="card"><div class="label">Saídas</div><div class="value red">${money(d.expense)}</div></div><div class="card"><div class="label">Saldo do mês</div><div class="value blue">${money(Number(d.income)-Number(d.expense))}</div></div></div><div class="pagegrid" style="margin-top:20px"><div class="panel"><div class="panelhead"><h2>Gastos por categoria</h2><span class="muted">${top.length} categorias</span></div>${top.length?top.map(([n,v])=>`<div style="margin:15px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><b>${esc(n)}</b><span>${money(v)}</span></div><div style="height:8px;background:var(--soft);border-radius:99px;margin-top:7px"><div style="height:100%;width:${Math.max(3,v/Math.max(1,top[0][1])*100)}%;background:var(--blue);border-radius:99px"></div></div></div>`).join(''):'<div class="empty">Ainda não há gastos categorizados.</div>'}</div><div class="panel"><div class="panelhead"><h2>Fluxo diário</h2></div>${chart(d.byDay||[])}</div></div>`}
function categories(el){const d=state.data;el.innerHTML=head('Categorias','Organize entradas e despesas por tipo',`<button class="btn" data-action="category">＋ Nova Categoria</button>`)+`<div class="pagegrid" style="margin-top:24px"><div class="panel"><h2>Suas categorias</h2><div class="accounts" style="margin-top:16px">${d.categories.map(c=>`<div class="account"><div><b><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c.color};margin-right:7px"></span>${esc(c.name)}</b><span>${c.isIncome?'Entrada':'Despesa'}</span></div><button class="iconbtn" data-delete-cat="${c.id}">🗑</button></div>`).join('')}</div></div><div class="panel"><h2>Dica</h2><p class="muted">Use categorias consistentes para que os relatórios mostrem seus maiores gastos e ajudem você a definir orçamentos.</p></div></div>`}
function budgets(el){const d=state.data;el.innerHTML=head('Orçamentos','Defina limites mensais para seus gastos',`<button class="btn" data-action="budget">＋ Novo Orçamento</button>`)+`<div class="pagegrid" style="margin-top:24px">${d.budgets.length?d.budgets.map(b=>{const c=d.categories.find(x=>x.id===b.categoryId),pct=Math.min(100,Number(b.spent)/Math.max(1,Number(b.limitAmount))*100);return `<div class="panel"><div class="panelhead"><h2>${c?esc(c.name):'Categoria'}</h2><button class="iconbtn" data-delete-budget="${b.id}">🗑</button></div><div style="font-size:24px;font-weight:850">${money(b.spent)} <span class="muted" style="font-size:13px">de ${money(b.limitAmount)}</span></div><div style="height:10px;background:var(--soft);border-radius:99px;margin-top:15px"><div style="height:100%;width:${pct}%;background:${pct>90?'var(--red)':'var(--green)'};border-radius:99px"></div></div><small class="muted">${pct.toFixed(0)}% utilizado</small></div>`}).join(''):'<div class="panel"><div class="empty">Você ainda não criou nenhum orçamento.</div></div>'}</div>`}
function settings(el){const p=localStorage.getItem('financeflow.theme')||'system',c=claims,d=state.data;el.innerHTML=head('Configurações','Personalize o FinanceFlow para o seu jeito',`<button class="iconbtn" data-action="theme" title="Alternar tema">◐</button>`)+`<div class="pagegrid" style="margin-top:24px"><div class="panel"><h2>Aparência</h2><div class="settingrow"><div><b>Tema</b><div class="muted">Escolha claro, escuro ou acompanhar o dispositivo.</div></div><select id="themeSelect" style="width:150px"><option value="system" ${p==='system'?'selected':''}>Automático</option><option value="light" ${p==='light'?'selected':''}>Claro</option><option value="dark" ${p==='dark'?'selected':''}>Escuro</option></select></div><div class="settingrow"><div><b>Preferência do dispositivo</b><div class="muted">Automático acompanha o tema do sistema operacional.</div></div><span class="pill in">${matchMedia('(prefers-color-scheme: dark)').matches?'Escuro':'Claro'}</span></div></div><div class="panel"><div class="panelhead"><h2>Contas</h2><button class="btn" data-action="account">＋ Nova</button></div><div class="accounts">${(d?.accounts||[]).map(a=>`<div class="account"><div><b>${esc(a.name)}</b><span>${esc(a.institution||a.type)}</span></div><div class="accountactions"><span class="money">${money(a.balance)}</span><button class="iconbtn" data-edit-account="${a.id}">✎</button><button class="iconbtn" data-delete-account="${a.id}">🗑</button></div></div>`).join('')}</div></div><div class="panel"><h2>Sua conta</h2><div class="settingrow"><div><b>${esc(c.name||'Usuário')}</b><div class="muted">${esc(c.email||'')}</div></div></div><div style="padding-top:18px"><button class="btn danger" data-action="logout">Sair da conta</button></div></div></div>`}
function openModal(html){document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function openTransaction(){const d=state.data;openModal(`<div class="modalhead"><h3>Nova transação</h3><button class="iconbtn" data-close>×</button></div><form id="txForm"><div class="formgrid"><div class="field"><label>Tipo</label><select name="type"><option value="Expense">Saída</option><option value="Income">Entrada</option></select></div><div class="field"><label>Valor</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Descrição</label><input name="description" maxlength="180" required placeholder="Ex.: Mercado"></div><div class="field"><label>Data</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Conta</label><select name="accountId" required>${d.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Categoria</label><select name="categoryId"><option value="">Sem categoria</option>${d.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field full"><label>Observação</label><textarea name="notes"></textarea></div></div><div style="text-align:right;margin-top:20px"><button type="button" class="btn secondary" data-close>Cancelar</button> <button class="btn">Salvar transação</button></div></form>`)}
function openCategory(){openModal(`<div class="modalhead"><h3>Nova categoria</h3><button class="iconbtn" data-close>×</button></div><form id="catForm"><div class="formgrid"><div class="field full"><label>Nome</label><input name="name" required placeholder="Ex.: Alimentação"></div><div class="field"><label>Tipo</label><select name="isIncome"><option value="false">Despesa</option><option value="true">Entrada</option></select></div><div class="field"><label>Cor</label><input name="color" type="color" value="#0aa579"></div></div><div style="text-align:right;margin-top:20px"><button class="btn">Criar categoria</button></div></form>`)}
function openBudget(){const d=state.data;openModal(`<div class="modalhead"><h3>Novo orçamento</h3><button class="iconbtn" data-close>×</button></div><form id="budgetForm"><div class="formgrid"><div class="field full"><label>Categoria</label><select name="categoryId" required>${d.categories.filter(c=>!c.isIncome).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Limite mensal</label><input name="limitAmount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Mês</label><input name="month" type="month" value="${state.date.getFullYear()}-${String(state.date.getMonth()+1).padStart(2,'0')}" required></div></div><div style="text-align:right;margin-top:20px"><button class="btn">Salvar orçamento</button></div></form>`)}
function openAccount(id){const a=id?state.data.accounts.find(x=>x.id===id):null;openModal(`<div class="modalhead"><h3>${a?'Editar conta':'Nova conta'}</h3><button class="iconbtn" data-close>×</button></div><form id="accountForm" data-id="${a?.id||''}"><div class="formgrid"><div class="field"><label>Instituição</label><input name="institution" value="${esc(a?.institution||'')}" placeholder="Ex.: Nubank"></div><div class="field"><label>Nome</label><input name="name" required value="${esc(a?.name||'')}" placeholder="Ex.: Conta corrente"></div><div class="field"><label>Tipo</label><select name="type"><option value="Checking" ${a?.type==='Checking'?'selected':''}>Conta corrente</option><option value="Savings" ${a?.type==='Savings'?'selected':''}>Poupança</option><option value="Investment" ${a?.type==='Investment'?'selected':''}>Investimento</option><option value="Wallet" ${a?.type==='Wallet'?'selected':''}>Carteira</option></select></div><div class="field"><label>Saldo inicial</label><input name="balance" type="number" step="0.01" value="${a?.balance??0}"></div></div><div style="text-align:right;margin-top:20px"><button class="btn">${a?'Salvar alterações':'Criar conta'}</button></div></form>`)}
async function submitForm(form){const f=new FormData(form);if(form.id==='txForm'){await api('/finance/transactions',{method:'POST',body:JSON.stringify({accountId:f.get('accountId'),categoryId:f.get('categoryId')||null,description:f.get('description'),amount:Number(f.get('amount')),type:f.get('type'),date:new Date(f.get('date')+'T12:00:00').toISOString(),notes:f.get('notes')||null})});toast('Transação salva.')}else if(form.id==='catForm'){await api('/finance/categories',{method:'POST',body:JSON.stringify({name:f.get('name'),color:f.get('color'),isIncome:f.get('isIncome')==='true'})});toast('Categoria criada.')}else if(form.id==='budgetForm'){await api('/finance/budgets',{method:'POST',body:JSON.stringify({categoryId:f.get('categoryId'),month:new Date(f.get('month')+'-01T00:00:00Z').toISOString(),limitAmount:Number(f.get('limitAmount'))})});toast('Orçamento salvo.')}else if(form.id==='accountForm'){const id=form.dataset.id;const body={institution:f.get('institution'),name:f.get('name'),type:f.get('type'),balance:Number(f.get('balance')||0)};await api(id?'/finance/accounts/'+id:'/finance/accounts',{method:id?'PUT':'POST',body:JSON.stringify(body)});toast(id?'Conta atualizada.':'Conta criada.')}closeModal();await load()}
async function remove(path,msg){if(!confirm('Tem certeza que deseja excluir?'))return;try{await api(path,{method:'DELETE'});toast(msg);await load()}catch(e){toast(e.message,true)}}
function toast(msg,error=false){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(error?' error':'');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.className='toast',3200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function logout(){const rt=localStorage.getItem('financeflow.refreshToken');try{if(rt)await api('/auth/logout',{method:'POST',body:JSON.stringify({refreshToken:rt})})}catch{}localStorage.removeItem('financeflow.accessToken');localStorage.removeItem('financeflow.refreshToken');location.replace('frontend/auth.html')}
document.addEventListener('click',async e=>{const nav=e.target.closest('[data-nav]');if(nav){go(nav.dataset.nav);return}if(e.target.closest('[data-close]')){closeModal();return}const m=e.target.closest('[data-month]');if(m){state.date.setMonth(state.date.getMonth()+Number(m.dataset.month));load().catch(x=>toast(x.message,true));return}const a=e.target.closest('[data-action]');if(a){const x=a.dataset.action;if(x==='theme')cycleTheme();if(x==='transaction')openTransaction();if(x==='category')openCategory();if(x==='budget')openBudget();if(x==='account')openAccount();if(x==='logout')logout();return}const dt=e.target.closest('[data-delete-tx]');if(dt){remove('/finance/transactions/'+dt.dataset.deleteTx,'Transação excluída.');return}const dc=e.target.closest('[data-delete-cat]');if(dc){remove('/finance/categories/'+dc.dataset.deleteCat,'Categoria excluída.');return}const db=e.target.closest('[data-delete-budget]');if(db){remove('/finance/budgets/'+db.dataset.deleteBudget,'Orçamento excluído.');return}const da=e.target.closest('[data-delete-account]');if(da){remove('/finance/accounts/'+da.dataset.deleteAccount,'Conta excluída.');return}const ea=e.target.closest('[data-edit-account]');if(ea){openAccount(ea.dataset.editAccount);return}});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('submit',e=>{if(['txForm','catForm','budgetForm','accountForm'].includes(e.target.id)){e.preventDefault();submitForm(e.target).catch(x=>toast(x.message,true))}});
document.addEventListener('change',e=>{if(e.target.id==='themeSelect')setTheme(e.target.value)});
applyTheme();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if((localStorage.getItem('financeflow.theme')||'system')==='system')applyTheme()});
document.getElementById('userName').textContent=claims.unique_name||claims.name||claims.email||'FinanceFlow';
if(!token()){location.replace('frontend/auth.html')}else{render();load().catch(e=>{toast(e.message,true);document.getElementById('app').innerHTML='<div class="panel"><h2>Não foi possível carregar seus dados</h2><p class="muted">O backend não respondeu. Verifique o Railway e atualize a página.</p></div>'})}
</script>
</body>
</html>
