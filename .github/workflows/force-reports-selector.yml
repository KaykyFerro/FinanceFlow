name: Atualizar Relatorios

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Garantir seletor de mes nos relatorios
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "function reports(el){const d=state.data,byCat={};"
          new = "function reports(el){/* Seletor de mes compartilhado com o Dashboard. */const d=state.data,byCat={};"
          if old not in s:
              raise SystemExit('Trecho esperado de reports nao encontrado')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/force-reports-selector.yml
          git commit -m "Corrige seletor de mes nos relatorios"
          git push
