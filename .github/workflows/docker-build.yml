name: Docker Build Check

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - "src/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --progress=plain -t financeflow-api:test .
