name: Patch reports date selector
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-reports-date.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add month selector to reports
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          needle = "el.innerHTML=head('Relatórios','Entenda para onde seu dinheiro está indo')+`<div class=\"reportgrid\""
          replacement = "el.innerHTML=head('Relatórios','Entenda para onde seu dinheiro está indo')+monthBox()+`<div class=\"reportgrid\""
          if needle in s:
              s = s.replace(needle, replacement, 1)
              p.write_text(s, encoding='utf-8')
          elif "head('Relatórios','Entenda para onde seu dinheiro está indo')+monthBox()+" in s:
              print('Already patched')
          else:
              raise SystemExit('reports header pattern not found')
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-reports-date.yml
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Adicionar seletor de mês aos relatórios [skip ci]'
          git push
