name: Fix FinanceFlow index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix broken JavaScript escaping
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find("function esc(s)")
          end = s.find("\ndocument.addEventListener", start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate esc() function')
          new = '''function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}'''
          fixed = s[:start] + new + s[end:]
          p.write_text(fixed, encoding='utf-8')
          print('FinanceFlow esc() replaced')
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore FinanceFlow dashboard script'
          git push
# trigger fix
