name: Fix FinanceFlow index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix broken JavaScript escaping
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r"function esc\(s\)\{.*?\}\[c\]\)\}"
          new = """function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}"""
          fixed, n = re.subn(pattern, new, s, count=1, flags=re.S)
          if n:
              p.write_text(fixed, encoding='utf-8')
              print('FinanceFlow esc() fixed')
          else:
              raise SystemExit('esc() function not found')
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore FinanceFlow dashboard script'
          git push
# trigger fix
