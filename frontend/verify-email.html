<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinanceFlow | Verificar e-mail</title><style>body{font-family:system-ui;background:#f5f7fa;min-height:100vh;display:grid;place-items:center;margin:0}.card{background:#fff;padding:35px;border-radius:16px;text-align:center;box-shadow:0 15px 45px #10213f12}button{background:#0aa579;color:#fff;border:0;padding:12px 18px;border-radius:8px;font-weight:700;cursor:pointer}</style></head><body><main class="card"><h1>FinanceFlow</h1><p id="status">Confirmando seu e-mail...</p><button onclick="location.href='auth.html'">Ir para o login</button></main><script>const API_URL=window.FINANCEFLOW_API_URL||'http://localhost:5000/api';const token=new URLSearchParams(location.search).get('token');fetch(API_URL+'/auth/verify-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})}).then(async r=>{const d=await r.json();document.getElementById('status').textContent=d.message||'Não foi possível confirmar o e-mail.'}).catch(()=>document.getElementById('status').textContent='Não foi possível conectar à API.');</script></body></html>
