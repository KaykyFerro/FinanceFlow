<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinanceFlow | Verificar e-mail</title><style>:root{--green:#0aa579;--text:#10213f;--muted:#697386;--danger:#dc3158}body{font-family:system-ui;background:#f5f7fa;min-height:100vh;display:grid;place-items:center;margin:0;color:var(--text)}.card{width:min(440px,calc(100% - 40px));background:#fff;padding:35px;border-radius:16px;text-align:center;box-shadow:0 15px 45px #10213f12}.logo{width:52px;height:52px;border-radius:15px;background:var(--green);color:#fff;display:grid;place-items:center;margin:0 auto 15px}.message{padding:13px;border-radius:9px;background:#eef8f5;color:#08785d;margin:20px 0}.error{background:#fff0f3;color:var(--danger)}a{display:inline-block;background:var(--green);color:#fff;text-decoration:none;padding:12px 18px;border-radius:8px;font-weight:700}</style></head><body><main class="card"><div class="logo">▣</div><h1>FinanceFlow</h1><p>Verificação de e-mail</p><div id="status" class="message">Confirmando seu e-mail...</div><a href="./auth.html">Ir para o login</a></main><script>const API_URL='https://financeflow-production-edfc.up.railway.app/api';const status=document.getElementById('status');const token=new URLSearchParams(location.search).get('token');(async()=>{if(!token){status.textContent='Link de confirmação inválido.';status.classList.add('error');return}try{const r=await fetch(API_URL+'/auth/verify-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'Não foi possível confirmar o e-mail.');status.textContent=d.message||'E-mail confirmado com sucesso!'}catch(e){status.textContent=e.message;status.classList.add('error')}})();</script></body></html>
