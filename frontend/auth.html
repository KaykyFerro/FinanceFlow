<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0aa579">
<title>FinanceFlow | Acesso</title>
<style>
:root{--green:#0aa579;--text:#10213f;--muted:#697386;--bg:#f5f7fa;--card:#fff;--line:#e5e8ee;--danger:#dc3158;--input:#fff;--tab:#f2f4f7;--shadow:0 18px 50px #10213f12}
[data-theme=dark]{--text:#edf3fb;--muted:#9aa8ba;--bg:#0f141b;--card:#171e27;--line:#2b3542;--danger:#ff4d73;--input:#202a38;--tab:#202934;--shadow:0 18px 50px rgba(0,0,0,.28)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);display:grid;place-items:center;padding:24px}.card{position:relative;width:min(440px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:var(--shadow)}.theme-toggle{position:absolute;top:16px;right:16px;width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:var(--tab);color:var(--text);display:grid;place-items:center;font-size:18px;cursor:pointer}.theme-toggle:hover{border-color:var(--green);color:var(--green)}.brand{text-align:center;margin-bottom:28px}.logo{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;margin:0 auto 12px;overflow:hidden;box-shadow:0 10px 28px rgba(0,216,196,.16)}.logo img{width:100%;height:100%;display:block}.brand h1{margin:0;font-size:25px}.brand p{margin:6px 0 0;color:var(--muted);font-size:14px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--tab);border-radius:10px;padding:4px;margin-bottom:22px}.tabs button{border:0;background:transparent;padding:10px;border-radius:8px;font-weight:650;color:var(--muted);cursor:pointer}.tabs button.active{background:var(--card);color:var(--green);box-shadow:0 2px 8px #10213f12}.field{margin-bottom:15px}.field label{display:block;font-size:13px;font-weight:650;margin-bottom:7px}.field input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:9px;font:inherit;outline:none;background:var(--input);color:var(--text)}.field input:focus{border-color:var(--green);box-shadow:0 0 0 3px #0aa57918}.primary{width:100%;border:0;background:var(--green);color:#fff;padding:13px;border-radius:9px;font-weight:700;cursor:pointer}.secondary{border:0;background:none;color:var(--green);font-weight:650;cursor:pointer;padding:12px 0}.message{margin-top:15px;padding:11px 12px;border-radius:9px;background:#eef8f5;color:#08785d;font-size:13px;display:none}.message.error{background:#fff0f3;color:var(--danger)}.small{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}.hidden{display:none!important}
</style>
</head>
<body>
<main class="card">
  <button type="button" class="theme-toggle" id="themeToggle" title="Tema automático" aria-label="Alterar tema">◐</button>
  <div class="brand"><div class="logo"><img src="assets/financeflow-logo.svg" alt="FinanceFlow"></div><h1>FinanceFlow</h1><p>Controle financeiro simples e inteligente</p></div>
  <div class="tabs"><button id="loginTab" class="active">Entrar</button><button id="registerTab">Criar conta</button></div>

  <form id="loginForm">
    <div class="field"><label>E-mail</label><input id="loginEmail" type="email" autocomplete="email" required></div>
    <div class="field"><label>Senha</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
    <button class="primary">Entrar</button>
    <button type="button" class="secondary" id="forgotLink">Esqueci minha senha</button>
  </form>

  <form id="registerForm" class="hidden">
    <div class="field"><label>E-mail</label><input id="registerEmail" type="email" autocomplete="email" required></div>
    <div class="field"><label>Senha</label><input id="registerPassword" type="password" minlength="8" autocomplete="new-password" required></div>
    <div class="field"><label>Confirmar senha</label><input id="registerPasswordConfirm" type="password" minlength="8" autocomplete="new-password" required></div>
    <button class="primary">Criar conta</button>
  </form>

  <form id="forgotForm" class="hidden">
    <div class="field"><label>E-mail cadastrado</label><input id="forgotEmail" type="email" autocomplete="email" required></div>
    <button class="primary">Enviar recuperação</button>
    <button type="button" class="secondary" id="backLogin">Voltar para o login</button>
  </form>

  <div id="message" class="message"></div>
  <div class="small">Sua senha nunca é armazenada em texto puro.</div>
</main>
<script>
const API_URL = 'https://financeflow-production-edfc.up.railway.app/api';
const $=id=>document.getElementById(id); const msg=$('message');
function applyTheme(){const p=localStorage.getItem('financeflow.theme')||'system';const dark=p==='dark'||(p==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';document.querySelector('meta[name="theme-color"]').content=dark?'#0f141b':'#0aa579';$('themeToggle').textContent=p==='system'?'◐':p==='dark'?'☀':'☾';$('themeToggle').title=p==='system'?'Tema automático':p==='dark'?'Tema escuro':'Tema claro'}
function cycleTheme(){const p=localStorage.getItem('financeflow.theme')||'system';localStorage.setItem('financeflow.theme',p==='system'?'dark':p==='dark'?'light':'system');applyTheme()}
$('themeToggle').onclick=cycleTheme;
applyTheme();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if((localStorage.getItem('financeflow.theme')||'system')==='system')applyTheme()});
function message(text,error=false){msg.textContent=text;msg.className='message'+(error?' error':'');msg.style.display='block'}
function hideMessage(){msg.style.display='none'}
function show(mode){$('loginForm').classList.toggle('hidden',mode!=='login');$('registerForm').classList.toggle('hidden',mode!=='register');$('forgotForm').classList.toggle('hidden',mode!=='forgot');$('loginTab').classList.toggle('active',mode==='login');$('registerTab').classList.toggle('active',mode==='register');hideMessage()}
$('loginTab').onclick=()=>show('login');$('registerTab').onclick=()=>show('register');$('forgotLink').onclick=()=>show('forgot');$('backLogin').onclick=()=>show('login');
async function api(path,options={}){try{const res=await fetch(API_URL+path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.message||`A API respondeu com erro (${res.status}).`);return data}catch(err){if(err instanceof TypeError)throw new Error('Não foi possível conectar ao servidor. Verifique se a API do FinanceFlow está online.');throw err}}
$('loginForm').onsubmit=async e=>{e.preventDefault();hideMessage();try{const email=$('loginEmail').value.trim();const data=await api('/auth/login',{method:'POST',body:JSON.stringify({email,password:$('loginPassword').value})});localStorage.setItem('financeflow.accessToken',data.accessToken);localStorage.setItem('financeflow.refreshToken',data.refreshToken);window.location.href='../index.html'}catch(err){message(err.message,true)}};
$('registerForm').onsubmit=async e=>{e.preventDefault();if($('registerPassword').value!==$('registerPasswordConfirm').value)return message('As senhas não conferem.',true);try{const email=$('registerEmail').value.trim();const data=await api('/auth/register',{method:'POST',body:JSON.stringify({email,password:$('registerPassword').value})});$('loginEmail').value=email;show('login');message(data.message||'Cadastro criado com sucesso. Você já pode entrar.')}catch(err){message(err.message,true)}};
$('forgotForm').onsubmit=async e=>{e.preventDefault();try{const data=await api('/auth/forgot-password',{method:'POST',body:JSON.stringify({email:$('forgotEmail').value})});message(data.message)}catch(err){message(err.message,true)}};
</script>
</body>
</html>
