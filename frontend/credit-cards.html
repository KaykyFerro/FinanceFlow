<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinanceFlow | Cartões</title>
<style>
:root{--g:#0aa579;--bg:#f5f7fa;--card:#fff;--text:#10213f;--muted:#728099;--line:#e5e8ee;--soft:#f3f6f8;--red:#ed2858;--blue:#3569e8}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}.wrap{width:min(1200px,94%);margin:30px auto 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:12px;background:#08131f;color:#fff;display:grid;place-items:center;font-size:23px;font-weight:900;border:2px solid var(--g)}h1{margin:0;font-size:30px}.muted{color:var(--muted);font-size:13px}.btn{border:0;border-radius:9px;background:var(--g);color:#fff;font-weight:800;padding:11px 16px;cursor:pointer}.btn.secondary{background:var(--soft);color:var(--text);border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:20px;box-shadow:0 10px 28px rgba(16,33,63,.07)}.credit{background:linear-gradient(135deg,#101b2a,#20324a);color:#fff;min-height:175px;display:flex;flex-direction:column;justify-content:space-between}.credit small{opacity:.7}.credit strong{font-size:22px}.limit{display:flex;justify-content:space-between;margin-top:12px;font-size:13px}.bar{height:7px;border-radius:99px;background:#ffffff2b;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#18c18e}.section{margin-top:22px}.panel h2{font-size:18px;margin:0 0 15px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 9px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted);font-size:11px}.pill{padding:5px 8px;border-radius:999px;font-weight:800;font-size:11px}.open{background:#fff4d7;color:#9a6800}.closed{background:#e9efff;color:#3569e8}.paid{background:#e4f8f1;color:#07845f}.overdue{background:#ffe8ee;color:#ed2858}.modal{position:fixed;inset:0;background:#06111baa;display:none;place-items:center;padding:18px}.modal.show{display:grid}.box{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:15px;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.head h2{margin:0}.x{border:0;background:transparent;font-size:24px;cursor:pointer}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#eef4ff;color:var(--text);padding:11px 12px;border-radius:9px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.empty{text-align:center;padding:35px;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;background:var(--card);border:1px solid var(--line);padding:13px 16px;border-radius:10px;box-shadow:0 10px 30px #0002;display:none}.toast.show{display:block}.toast.err{color:var(--red)}@media(max-width:850px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><div class="logo">F</div><div><h1>Cartões de crédito</h1><div class="muted">Limites, compras parceladas e faturas</div></div></div><div><button class="btn secondary" onclick="location.href='../index.html'">← FinanceFlow</button> <button class="btn" onclick="openCard()">＋ Novo cartão</button></div></header>
<section id="cards" class="grid"></section>
<section class="section panel"><h2>Histórico de faturas</h2><div id="invoices"><div class="empty">Selecione um cartão para visualizar as faturas.</div></div></section>
</div>
<div class="modal" id="modal"><div class="box" id="box"></div></div><div class="toast" id="toast"></div>
<script>
const API='https://financeflow-production-edfc.up.railway.app/api';let cards=[];let selected=null;
const token=()=>localStorage.getItem('financeflow.accessToken')||'';const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0));
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{}),Authorization:'Bearer '+token()}});const text=await r.text();let d={};try{d=text?JSON.parse(text):{}}catch{}if(!r.ok)throw Error(d.message||'Não foi possível concluir a operação.');return d}
function toast(msg,err=false){const x=document.getElementById('toast');x.textContent=msg;x.className='toast show'+(err?' err':'');setTimeout(()=>x.className='toast',3500)}
async function load(){try{cards=await api('/credit-cards');renderCards();if(cards[0]) selectCard(cards[0].id)}catch(e){toast(e.message,true)}}
function renderCards(){const el=document.getElementById('cards');if(!cards.length){el.innerHTML='<div class="card empty">Nenhum cartão cadastrado.<br><br><button class="btn" onclick="openCard()">Cadastrar cartão</button></div>';return}el.innerHTML=cards.map(c=>{const used=Number(c.usedLimit||0),limit=Number(c.creditLimit||0),pct=limit?Math.min(100,used/limit*100):0;return `<article class="card credit"><div><small>${esc(c.institution||'Instituição')}</small><div><strong>${esc(c.name)}</strong> ${c.lastFourDigits?'•••• '+esc(c.lastFourDigits):''}</div></div><div><div class="limit"><span>Disponível ${money(c.availableLimit)}</span><span>Limite ${money(limit)}</span></div><div class="bar"><i style="width:${pct}%"></i></div><div class="limit"><span>Fecha dia ${c.closingDay}</span><span>Vence dia ${c.dueDay}</span></div><div style="margin-top:12px"><button class="btn secondary" onclick="selectCard('${c.id}')">Ver faturas</button> <button class="btn secondary" onclick="openPurchase('${c.id}')">＋ Compra</button></div></div></article>`}).join('')}
async function selectCard(id){selected=id;try{const d=await api('/credit-cards/'+id);renderInvoices(d.invoices||[])}catch(e){toast(e.message,true)}}
function renderInvoices(list){const el=document.getElementById('invoices');if(!list.length){el.innerHTML='<div class="empty">Este cartão ainda não possui faturas.</div>';return}el.innerHTML='<div class="tablewrap"><table class="table"><thead><tr><th>Fatura</th><th>Fechamento</th><th>Vencimento</th><th>Total</th><th>Pago</th><th>Status</th><th></th></tr></thead><tbody>'+list.map(i=>`<tr><td>${month(i.referenceMonth)}</td><td>${date(i.closingDate)}</td><td>${date(i.dueDate)}</td><td><b>${money(i.totalAmount)}</b></td><td>${money(i.paidAmount)}</td><td><span class="pill ${i.status.toLowerCase()}">${status(i.status)}</span></td><td>${i.status!=='Paid'&&i.totalAmount>i.paidAmount?`<button class="btn" onclick="payInvoice('${i.id}',${Number(i.totalAmount-i.paidAmount)})">Pagar</button>`:''}</td></tr><tr><td colspan="7"><details><summary>${i.lines.length} item(ns) na fatura</summary><div style="padding:10px 0">${i.lines.map(l=>`<div style="display:flex;justify-content:space-between;padding:5px 0"><span>${esc(l.description)} <small class="muted">(${l.installmentNumber}/${l.installments})</small></span><b>${money(l.amount)}</b></div>`).join('')}</div></details></td></tr>`).join('')+'</tbody></table></div>'}
function openCard(){show(`<div class="head"><h2>Novo cartão</h2><button class="x" onclick="closeModal()">×</button></div><form class="form" onsubmit="saveCard(event)"><div class="field"><label>Instituição</label><input name="institution" placeholder="Nubank" /></div><div class="field"><label>Nome do cartão</label><input name="name" placeholder="Nubank Ultravioleta" required /></div><div class="field"><label>Limite total</label><input name="limit" type="number" min="0" step="0.01" required /></div><div class="field"><label>Últimos 4 dígitos</label><input name="last4" maxlength="4" inputmode="numeric" /></div><div class="field"><label>Dia de fechamento</label><input name="closing" type="number" min="1" max="28" value="10" required /></div><div class="field"><label>Dia de vencimento</label><input name="due" type="number" min="1" max="28" value="17" required /></div><div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn">Salvar</button></div></form>`)}
async function saveCard(e){e.preventDefault();const f=new FormData(e.target);try{await api('/credit-cards',{method:'POST',body:JSON.stringify({institution:f.get('institution'),name:f.get('name'),creditLimit:Number(f.get('limit')),closingDay:Number(f.get('closing')),dueDay:Number(f.get('due')),lastFourDigits:f.get('last4'),active:true})});closeModal();toast('Cartão cadastrado.');await load()}catch(x){toast(x.message,true)}}
async function openPurchase(id){selected=id;show(`<div class="head"><h2>Nova compra</h2><button class="x" onclick="closeModal()">×</button></div><form class="form" onsubmit="savePurchase(event)"><div class="field full"><label>Descrição</label><input name="description" placeholder="Ex.: Mercado" required /></div><div class="field"><label>Valor total</label><input name="amount" type="number" min="0.01" step="0.01" required /></div><div class="field"><label>Parcelas</label><input name="installments" type="number" min="1" max="120" value="1" required /></div><div class="field"><label>Data da compra</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required /></div><div class="field"><label>Primeira fatura (opcional)</label><input name="first" type="month" /></div><div class="field full"><label>Observações</label><textarea name="notes"></textarea></div><div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn">Lançar compra</button></div></form>`)}
async function savePurchase(e){e.preventDefault();const f=new FormData(e.target);try{await api('/credit-cards/'+selected+'/purchases',{method:'POST',body:JSON.stringify({description:f.get('description'),amount:Number(f.get('amount')),installments:Number(f.get('installments')),purchaseDate:new Date(f.get('date')+'T12:00:00').toISOString(),firstInvoiceMonth:f.get('first')?new Date(f.get('first')+'-01T00:00:00Z').toISOString():null,categoryId:null,notes:f.get('notes')||null})});closeModal();toast('Compra lançada.');await load()}catch(x){toast(x.message,true)}}
async function payInvoice(id,max){const value=prompt('Valor para pagar da fatura:',max.toFixed(2));if(value===null)return;const amount=Number(value.replace(',','.'));if(!amount||amount<=0)return toast('Valor inválido.',true);try{await api('/credit-cards/'+selected+'/invoices/'+id+'/pay',{method:'POST',body:JSON.stringify({amount})});toast('Pagamento registrado.');await selectCard(selected);await load()}catch(e){toast(e.message,true)}}
function show(html){document.getElementById('box').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
function date(v){return new Intl.DateTimeFormat('pt-BR').format(new Date(v))}function month(v){return new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(new Date(v))}function status(v){return ({Open:'Aberta',Closed:'Fechada',Paid:'Paga',Overdue:'Vencida'})[v]||v}function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}load();
</script>
</body></html>
