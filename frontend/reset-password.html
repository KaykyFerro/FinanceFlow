<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinanceFlow | Nova senha</title><style>body{font-family:system-ui;background:#f5f7fa;min-height:100vh;display:grid;place-items:center;margin:0}.card{background:#fff;padding:35px;border-radius:16px;width:min(400px,90%);box-shadow:0 15px 45px #10213f12}input,button{width:100%;padding:12px;margin:7px 0;border-radius:8px;box-sizing:border-box}input{border:1px solid #e5e8ee}button{background:#0aa579;color:#fff;border:0;font-weight:700;cursor:pointer}</style></head><body><main class="card"><h1>Nova senha</h1><p>Crie uma nova senha para sua conta FinanceFlow.</p><form id="form"><input id="password" type="password" minlength="8" placeholder="Nova senha" required><input id="confirm" type="password" minlength="8" placeholder="Confirmar senha" required><button>Alterar senha</button></form><p id="status"></p></main><script>const API_URL=window.FINANCEFLOW_API_URL||'http://localhost:5000/api';const token=new URLSearchParams(location.search).get('token');document.getElementById('form').onsubmit=async e=>{e.preventDefault();const password=document.getElementById('password').value;if(password!==document.getElementById('confirm').value)return document.getElementById('status').textContent='As senhas não conferem.';const r=await fetch(API_URL+'/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,newPassword:password})});const d=await r.json();document.getElementById('status').textContent=d.message||'Concluído.'};</script></body></html>
